name: Scheduled publishing

# Every day: render the videos listed in schedule.json that publish within the next few days and
# upload them to YouTube as private with a publish time. YouTube then publishes them by itself.
# Pause everything by setting "paused": true in schedule.json. Run it by hand from the Actions tab too.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core fonts-liberation
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Render and schedule what is coming up
        env:
          STRICT_VOICE: "1"
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scheduler.py
      - name: Save results to the repo
        if: always()
        run: |
          mkdir -p docs/videos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/videos
          git commit -m "Scheduled publishing: results" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase origin main && git push && break; sleep $((RANDOM % 15 + 5)); done
